{% load static %}
<!doctype html>
<html lang="en" class="h-full antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sennick AI — PDF Manager Login</title>
  <script src="{% static 'js/tailwind.js' %}"></script>

  <!-- HTMX (Offline) -->
  <script src="{% static 'js/htmx.min.js' %}"></script>
  
  <!-- Tailwind CDN (use a proper build in production) -->
    <!-- <script src="/static/css/chatbot.css"></script> -->

  <!-- Tailwind config: brand colors + Arial font -->
  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Arial', 'ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              blue: '#2563eb',  // primary
              green: '#10b981', // accent
              dark: '#0b1220',  // backgrounds/overlay
            }
          },
          boxShadow: {
            'soft': '0 10px 30px rgba(2, 6, 23, 0.25)'
          }
        }
      }
    }
  </script>

  <style>
    /* Focus ring helper for inline icon buttons */
    .focus-ring {
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .35);
    }
  </style>
</head>

<body class="h-full font-sans text-slate-800 dark:text-slate-100">
  <!-- Root hero: set a default BG image via CSS var -->
  <main id="loginHero" class="relative min-h-screen"
        style="--bg-url: url('/static/images/download3.jpg');">

    <!-- Layer 1: background image -->
    <div class="absolute inset-0 -z-30 bg-cover bg-center bg-no-repeat"
         style="background-image: var(--bg-url);"></div>

    <!-- Layer 2: subtle tiled PDF pattern (inline SVG, no requests) -->
    <div class="absolute inset-0 -z-20 opacity-30 mix-blend-overlay"
         style="background-image:
           url('data:image/svg+xml;utf8,\
           <svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2240%22 viewBox=%220 0 24 24%22>\
             <path fill=%22%23ffffff%22 fill-opacity=%220.22%22 d=%22M6 2h7l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm6 1.5V8h4.5L12 3.5ZM8.75 11h1.25a1.5 1.5 0 0 1 0 3H10v1.5H8.75V11Zm1.25 2a.5.5 0 0 0 0-1H9.5v1h.5Zm3.75-2h-2v5h1.25v-1.25h.75a1.75 1.75 0 0 0 0-3.5Zm-.75 2.25h-.75v-1h.75a.5.5 0 1 1 0 1ZM16 11h2v1.25h-.75V16H16V11Z%22/>\
           </svg>');"></div>

    <!-- Layer 3: gradient/dimming overlay for legibility -->
    <div class="absolute inset-0 -z-10 bg-gradient-to-br from-brand-dark/70 via-brand-dark/55 to-brand-dark/40"></div>

    <!-- Content -->
    <div class="relative min-h-screen flex items-center justify-center p-4">
      <div class="w-full max-w-md">
        <div class="backdrop-blur-md bg-white/90 dark:bg-slate-900/85 border border-white/20 dark:border-white/10 rounded-2xl shadow-soft">
          <!-- Brand -->
     <!-- Brand -->
<div class="px-6 pt-6 pb-4 text-center">
  <div class="mx-auto mb-3 inline-flex h-12 w-12 items-center justify-center rounded-xl bg-white/90 dark:bg-slate-800 ring-1 ring-white/50 dark:ring-white/10 shadow">
    <!-- Simple mark: speech bubble + brain (chat + AI) -->
    <svg width="24" height="24" viewBox="0 0 24 24" class="text-brand-blue fill-current">
      <path d="M12 2C6.48 2 2 6.03 2 10.5c0 2.29 1.1 4.35 2.9 5.84L4 22l5.13-2.42c.91.27 1.87.42 2.87.42 5.52 0 10-4.03 10-8.5S17.52 2 12 2z"/>
    </svg>
  </div>
  <h1 class="text-2xl font-bold tracking-tight">Chatbot AI Login</h1>
  <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">
    Intelligent Chat Assistant • Secure Access • Analytics Ready
  </p>
</div>


          <!-- Alerts -->
          <div id="formAlert" class="mx-6 hidden mb-3 rounded-lg border border-red-400 bg-red-50 text-red-700 px-4 py-2 text-sm"
               role="alert" aria-live="assertive"></div>

          <!-- Login Form -->
        <form id="loginForm" class="px-6 pb-6 space-y-4" novalidate>
  <!-- Username / Email -->
  <div>
    <label for="username" class="block text-sm font-medium mb-1">Username</label>
    <input id="username" name="username" type="text" inputmode="email" autocomplete="username" required
           class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/85 dark:bg-slate-800 px-3 py-2.5 text-sm placeholder-slate-400 focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/40 outline-none transition"
           placeholder="Enter the name" />
    <p class="mt-1 text-xs text-slate-500">Use your organization credentials.</p>
  </div>

  <!-- Role Selection -->
  <div>
    <label for="role" class="block text-sm font-medium mb-1">Role</label>
    <select id="role" name="role" required
            class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/85 dark:bg-slate-800 px-3 py-2.5 text-sm focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/40 outline-none transition">
      <option value="" disabled selected>Select role</option>
      <option value="admin">Admin</option>
      <option value="user">User</option>
    </select>
  </div>

  <!-- Password -->
  <div>
    <label for="password" class="block text-sm font-medium mb-1">Password</label>
    <div class="relative">
      <input id="password" name="password" type="password" autocomplete="current-password" required
             class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white/85 dark:bg-slate-800 px-3 py-2.5 pr-10 text-sm placeholder-slate-400 focus:border-brand-blue focus:ring-2 focus:ring-brand-blue/40 outline-none transition"
             placeholder="••••••••" />
      <button type="button" id="togglePass"
              class="absolute inset-y-0 right-0 px-3 text-slate-500 hover:text-slate-700 dark:hover:text-slate-200"
              aria-label="Show password">
        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Submit -->
  <div class="pt-2">
    <button id="submitBtn" type="submit"
            class="group inline-flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-brand-blue to-brand-green px-4 py-2.5 text-white text-sm font-semibold shadow-sm hover:opacity-95 focus:outline-none focus-visible:ring-4 focus-visible:ring-white/40 active:scale-[.99] transition">
      <span>Sign in</span>
      <svg id="spinner" class="h-5 w-5 animate-spin hidden" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4A4 4 0 008 12H4z"></path>
      </svg>
    </button>
  </div>
</form>

          <!-- Footer -->
          <div class="px-6 pb-6 text-center text-xs text-slate-200">
            © 2025 • Developed by ASDC, DGIS
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Minimal JS: show/hide password, validation, fake submit, background slideshow -->
<script>
  // =========================
  // Config
  // =========================
  // If your API is at a different origin, put the full origin before the path (and enable CORS in Django).
  const API_BASE = "https://dgis.army.mil/chatbot/"; // e.g. "https://api.example.com"
  // Use the custom raw-Postgres endpoint we built earlier:
  const LOGIN_ENDPOINT = API_BASE + "loginapi/";
  // If you prefer SimpleJWT's TokenObtainPairView instead, switch to:
  // const LOGIN_ENDPOINT = API_BASE + "/api/auth/login/";

  // =========================
  // Elements
  // =========================
  const form = document.getElementById('loginForm');
  const alertBox = document.getElementById('formAlert');
  const submitBtn = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const username = document.getElementById('username');
  const password = document.getElementById('password');
  const role = document.getElementById('role');
  const togglePass = document.getElementById('togglePass');
  const eyeIcon = document.getElementById('eyeIcon');
  const hero = document.getElementById('loginHero');
  const remember = document.getElementById('remember'); // optional

  // =========================
  // Helpers: alert / validation
  // =========================
  function showError(msg) {
    if (!alertBox) return;
    alertBox.textContent = msg;
    alertBox.classList.remove('hidden', 'border-green-400', 'bg-green-50', 'text-green-700');
    alertBox.classList.add('border-red-400', 'bg-red-50', 'text-red-700');
  }
  function showSuccess(msg) {
    if (!alertBox) return;
    alertBox.textContent = msg;
    alertBox.classList.remove('hidden', 'border-red-400', 'bg-red-50', 'text-red-700');
    alertBox.classList.add('border-green-400', 'bg-green-50', 'text-green-700');
  }
  function clearError() {
    if (!alertBox) return;
    alertBox.classList.add('hidden');
    alertBox.textContent = '';
  }
  function setInvalid(el, invalid = true) {
    if (!el) return;
    el.setAttribute('aria-invalid', invalid ? 'true' : 'false');
    el.classList.toggle('border-red-500', invalid);
    el.classList.toggle('focus:ring-red-400', invalid);
  }

  // =========================
  // Password show/hide
  // =========================
  if (togglePass && password) {
    togglePass.addEventListener('click', () => {
      const reveal = password.type === 'password';
      password.type = reveal ? 'text' : 'password';
      togglePass.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
      if (eyeIcon) {
        eyeIcon.innerHTML = reveal
          ? '<path d="M3.7 4.4 5.1 5.8C6.9 5 9.2 4.5 12 4.5c7 0 10 7 10 7s-1 2.3-3 4.2l1.3 1.3-1.4 1.4-17-17 1.4-1.4zM6.1 8.2 8 10c-.3.6-.5 1.2-.5 2 0 2.8 2.2 5 5 5 .7 0 1.4-.2 2-.5l1.8 1.8c-1.2.4-2.4.7-3.3.7-7 0-10-7-10-7s.8-1.9 2.1-3.8z"></path>'
          : '<path d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7zm0 12a5 5 0 110-10 5 5 0 010 10z"></path>';
      }
      togglePass.classList.add('focus-ring');
      setTimeout(() => togglePass.classList.remove('focus-ring'), 160);
    });
  }

  // =========================
  // Token storage + auth fetch
  // =========================
  function getTokenStorage() {
    return (remember && remember.checked) ? localStorage : sessionStorage;
  }

  // Optional helper for authenticated requests elsewhere:
  window.authFetch = async (url, options = {}) => {
    const token = localStorage.getItem('access') || sessionStorage.getItem('access');
    const headers = new Headers(options.headers || {});
    if (token) headers.set('Authorization', 'Bearer ' + token);
    return fetch(url, { ...options, headers });
  };

  // =========================
  // Submit handler
  // =========================
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      setInvalid(username, false);
      setInvalid(password, false);

      const u = (username && username.value || '').trim();
      const p = (password && password.value) || '';
      const r = (role && role.value) || '';
      let error = '';

      if (!u) error = 'Please enter your username.';
      else if (!p) error = 'Please enter your password.';
      else if (p.length < 6) error = 'Password must be at least 6 characters.';

      if (error) {
        showError(error);
        setInvalid(!u ? username : password, true);
        (!u ? username : password).focus();
        return;
      }

      if (submitBtn) submitBtn.disabled = true;
      if (spinner) spinner.classList.remove('hidden');

      try {
        const res = await fetch(LOGIN_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p ,role:r})
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          // DRF/SimpleJWT often returns {detail: "..."} on error
          const msg = data.detail || data.message || 'Login failed. Check your credentials.';
          showError(msg);
          setInvalid(password, true);
          password && password.focus();
        } else {
          // Expecting: { access, refresh, user: { id, username } }
          const storage = getTokenStorage();
          // Store access and refresh tokens
          if (data.access) storage.setItem('access', data.access);
          if (data.refresh) storage.setItem('refresh', data.refresh);
          if (data.user)    storage.setItem('user', JSON.stringify(data.user));

          showSuccess('Login successful.');
          // Redirect (adjust the path to your dashboard/home)
          setTimeout(() => { window.location.href = '/chatbot/analytics'; }, 500);
        }
      } catch (err) {
        console.error(err);
        showError('Network error. Please try again.');
      } finally {
        if (spinner) spinner.classList.add('hidden');
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  }

  // =========================
  // Background slideshow (optional)
  // =========================
  const slides = [
    "url('/static/images/download3.jpg')",
    "url('/static/images/download4.jpg')",
    "url('/static/images/download3.jpg')"
  ];
  let idx = 0;

  if (hero) {
    // Ensure your CSS uses: background-image: var(--bg-url);
    hero.style.setProperty('--bg-url', slides[idx]);
    setInterval(() => {
      idx = (idx + 1) % slides.length;
      hero.style.setProperty('--bg-url', slides[idx]);
    }, 8000);
  }
</script>

</body>
</html>
